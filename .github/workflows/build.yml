name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml builds through this workflow
  workflow_call:
    inputs:
      version:
        description: "Plugin version for the zip (default: the one in package.json)"
        required: false
        type: string
        default: ""

# read-only token: building needs no write access
permissions:
  contents: read

env:
  # Decky Loader for Windows runs plugins on its own Python; compiled wheels and python3.dll must match it
  DECKY_PYTHON: "3.14"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json)
        run: corepack enable

      - name: Set up Python ${{ env.DECKY_PYTHON }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DECKY_PYTHON }}

      - name: Lint the plugin's Python (rules in ruff.toml)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q ruff==0.17.1
          python -m ruff check main.py scripts py_modules/winqs tests

      - name: Test the backend logic that needs no hardware (tests/)
        run: python -I -m unittest discover -s tests -v

      - name: Build
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/build.py --python "$DECKY_PYTHON" ${VERSION:+--version "$VERSION"}

      - name: Check that the packages import on Decky's Python
        shell: bash
        run: |
          python -I -c "
          import sys
          sys.path.insert(0, 'build/windows-quick-settings/py_modules')
          import winrt.windows.devices.bluetooth, winrt.windows.devices.radios, winrt.windows.system.power
          import pycaw.pycaw, psutil
          print('ok:', psutil.Process().name())
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-quick-settings
          path: out/*.zip
          if-no-files-found: error
